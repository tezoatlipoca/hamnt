name: hamnt
version: '0.1.0'
summary: Hyper Aggressively Minimal Note Taking CLI
description: |
  CLI and interactive shell app for rapid note taking across multiple files.
  Allows quick access to notes via aliases regardless of their location.

base: core22
confinement: strict
grade: stable

apps:
  hamnt:
    command: bin/hamnt
    plugs:
      - home
      - network
      - personal-files
    environment:
      DOTNET_BUNDLE_EXTRACT_BASE_DIR: $SNAP_USER_COMMON/dotnet_extract

plugs:
  personal-files:
    interface: personal-files
    read:
      - $HOME/.config/hamnt
      - $HOME/.cache/dotnet_bundle_extract
    write:
      - $HOME/.config/hamnt
      - $HOME/.cache/dotnet_bundle_extract

parts:
  hamnt:
    plugin: dump
    source: ./bin/Release/net8.0/linux-x64/publish/
    organize:
      "hamnt": bin/hamnt