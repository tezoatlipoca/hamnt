name: hamnt
version: '0.1.0'
summary: Hyper Aggressively Minimal Note Taking CLI
description: |
  CLI and interactive shell app for rapid note taking across multiple files.
  Allows quick access to notes via aliases regardless of their location.

base: core22
confinement: strict
grade: stable

apps:
  hamnt:
    command: bin/hamnt
    plugs:
      - home
      - network

parts:
  hamnt:
    plugin: dotnet
    source: .
    source-type: local
    dotnet-build-configuration: Release
    build-packages:
      - dotnet-sdk-8.0
      - ca-certificates
    override-build: |
      # Clear NuGet cache and configure package sources
      rm -rf ~/.nuget
      mkdir -p ~/.nuget/NuGet
      echo '<?xml version="1.0" encoding="utf-8"?><configuration><packageSources><add key="nuget.org" value="https://api.nuget.org/v3/index.json" /></packageSources></configuration>' > ~/.nuget/NuGet/NuGet.Config
      
      # Restore packages explicitly before build
      dotnet restore --runtime linux-x64
      
      # Build and publish
      craftctl default
      dotnet publish -c Release --self-contained true -p:PublishSingleFile=true