name: Release Build
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}  # Add empty braces

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64

    steps:
    - uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'

    - name: Set version variable
      id: version
      run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
      shell: bash

    - name: Build
      run: |
        if [ "${{ matrix.os }}" = "windows-latest" ]; then
          pwsh -c "dotnet publish -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true"
        else
          dotnet publish -c Release -r ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:EnableCompressionInSingleFile=true || exit 1
        fi
      shell: bash

    - name: Show full path to win-x64 publish folder
      if: matrix.os == 'windows-latest'
      run: |
        echo "Full path to publish folder:"
        cd bin/Release/net8.0/win-x64/publish
        pwd
        echo "Contents of publish folder:"
        ls -l
      shell: bash

    - name: Create Release Asset
      if: success()
      run: |
        cd bin/Release/net8.0/${{ matrix.rid }}/publish/ || exit 1
        if [ "${{ matrix.os }}" = "windows-latest" ]; then
          pwsh -c "7z a -tzip ../../../../../hamnt.${VERSION}.win-x64.zip hamnt.exe || exit 1"
        else
          tar czf ../../../../../hamnt.${VERSION}.linux-x64.tar.gz hamnt || exit 1
        fi
      shell: bash

    - name: Upload Release Asset
      uses: softprops/action-gh-release@v1
      with:
        files: |
          hamnt.${{ env.VERSION }}.*

    - name: Install NSIS
      if: matrix.os == 'windows-latest'
      run: choco install nsis -y

    - name: Show current directory and files before makensis
      if: matrix.os == 'windows-latest'
      run: |
        pwd
        ls -l
        ls -l bin/Release/net8.0/win-x64/publish
      shell: bash

    - name: DEBUG-Confirm hamnt.exe exists for NSIS
      if: matrix.os == 'windows-latest'
      run: |
        if (Test-Path "bin\Release\net8.0\win-x64\publish\hamnt.exe") {
          Write-Host "hamnt.exe found!"
        } else {
          Write-Host "hamnt.exe NOT FOUND!"
        }
      shell: pwsh

    - name: Build NSIS Installer
      if: matrix.os == 'windows-latest'
      run: |
        & "C:\Program Files (x86)\NSIS\makensis.exe" "win.installer/install.nsi"
      shell: pwsh

    - name: Upload NSIS Installer
      if: matrix.os == 'windows-latest' && success()
      uses: softprops/action-gh-release@v1
      with:
        files: win.installer/hamnt-*-setup.exe

  create-deb:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'
      
      - name: Install dotnet-deb
        run: dotnet tool install -g dotnet-deb
        
      - name: Build Release
        run: |
          dotnet publish -c Release -r linux-x64 \
            --self-contained true \
            -p:PublishSingleFile=true
          
      - name: Create DEB Package
        run: dotnet-deb -c Release
        
      - name: Upload DEB Package
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: bin/Release/net8.0/linux-x64/*.deb

  create-snap:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Build with dotnet
        run: |
          dotnet publish -c Release -r linux-x64 \
            --self-contained true \
            -p:PublishSingleFile=true
      
      - name: Install Snapcraft and LXD
        run: |
          sudo snap install snapcraft --classic
          sudo snap install lxd
          # Add retry mechanism for LXD init
          max_retries=3
          count=0
          while [ $count -lt $max_retries ]; do
            if sudo lxd init --auto; then
              echo "LXD initialized successfully"
              break
            fi
            count=$((count + 1))
            echo "LXD init attempt $count failed, retrying..."
            sleep 5
          done
          
          if [ $count -eq $max_retries ]; then
            echo "Failed to initialize LXD after $max_retries attempts"
            exit 1
          fi
          
      - name: Setup network for LXD
        run: |
          # Configure LXD network
          sudo lxc network create lxdbr0 || true
          sudo lxc network attach-profile lxdbr0 default eth0 || true
          
      - name: Build Snap Package
        run: |
          # Build directly on the host system, bypassing LXD
          snapcraft --destructive-mode --verbose
          
      - name: Upload Snap Package
        if: success() && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: "*.snap"

