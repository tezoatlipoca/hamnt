name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:  # Allow manual triggers

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64

    steps:
    - uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'

    - name: Build
      run: |
        if [ "${{ matrix.os }}" = "windows-latest" ]; then
          pwsh -c "dotnet publish -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true"
        else
          dotnet publish -c Release -r ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:EnableCompressionInSingleFile=true || exit 1
        fi
      shell: bash

    - name: Create Release Asset
      if: success()
      run: |
        cd bin/Release/net8.0/${{ matrix.rid }}/publish/ || exit 1
        if [ "${{ matrix.os }}" = "windows-latest" ]; then
          pwsh -c "7z a -tzip ../../../../../hamnt-${{ matrix.rid }}.zip hamnt.exe || exit 1"
        else
          tar czf ../../../../../hamnt-${{ matrix.rid }}.tar.gz hamnt || exit 1
        fi
      shell: bash

    - name: Upload Release Asset
      uses: softprops/action-gh-release@v1
      with:
        files: |
          hamnt-${{ matrix.rid }}.*

  create-deb:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'
      
      - name: Install dotnet-deb
        run: dotnet tool install -g dotnet-deb
        
      - name: Build Release
        run: |
          dotnet publish -c Release -r linux-x64 \
            --self-contained true \
            -p:PublishSingleFile=true
          
      - name: Create DEB Package
        run: dotnet-deb -c Release
        
      - name: Upload DEB Package
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: bin/Release/*.deb

