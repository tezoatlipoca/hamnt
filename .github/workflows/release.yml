name: Release Build
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    outputs:
      winzip: ${{ steps.winzip.outputs.path }}
      nsis: ${{ steps.nsis.outputs.path }}
    steps:
      - uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Set version variable
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
        shell: bash

      - name: Build
        run: |
          dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true

      - name: Archive Windows Binary
        id: winzip
        run: |
          cd bin/Release/net8.0/win-x64/publish/
          7z a -tzip ../../../hamnt.${{ env.VERSION }}.win-x64.zip hamnt.exe
          echo "path=$(cd ../../../ && pwd)/hamnt.${{ env.VERSION }}.win-x64.zip" >> $GITHUB_OUTPUT

      - name: Install NSIS
        run: choco install nsis -y

      - name: Build NSIS Installer
        run: |
          & "C:\Program Files (x86)\NSIS\makensis.exe" "win.installer/install.nsi"
        shell: pwsh

      - name: Move NSIS Installer
        id: nsis
        run: |
          echo "path=$(cd win.installer && pwd)/hamnt-*-setup.exe" >> $GITHUB_OUTPUT

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            hamnt.${{ env.VERSION }}.win-x64.zip
            win.installer/hamnt-*-setup.exe

  build-linux:
    runs-on: ubuntu-latest
    outputs:
      linuxtar: ${{ steps.linuxtar.outputs.path }}
    steps:
      - uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Set version variable
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Build
        run: |
          dotnet publish -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true

      - name: Archive Linux Binary
        id: linuxtar
        run: |
          cd bin/Release/net8.0/linux-x64/publish/
          tar czf ../../../hamnt.${{ env.VERSION }}.linux-x64.tar.gz hamnt
          echo "path=$(cd ../../../ && pwd)/hamnt.${{ env.VERSION }}.linux-x64.tar.gz" >> $GITHUB_OUTPUT

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifact
          path: hamnt.${{ env.VERSION }}.linux-x64.tar.gz

  create-deb:
    runs-on: ubuntu-latest
    needs: build-linux
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Install dotnet-deb
        run: dotnet tool install -g dotnet-deb

      - name: Build Release
        run: |
          dotnet publish -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true

      - name: Create DEB Package
        run: dotnet-deb -c Release

      - name: Upload DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-artifact
          path: bin/Release/net8.0/linux-x64/*.deb

  create-snap:
    runs-on: ubuntu-latest
    needs: build-linux
    steps:
      - uses: actions/checkout@v3

      - name: Build with dotnet
        run: |
          dotnet publish -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true

      - name: Install Snapcraft and LXD
        run: |
          sudo snap install snapcraft --classic
          sudo snap install lxd
          max_retries=3
          count=0
          while [ $count -lt $max_retries ]; do
            if sudo lxd init --auto; then
              echo "LXD initialized successfully"
              break
            fi
            count=$((count + 1))
            echo "LXD init attempt $count failed, retrying..."
            sleep 5
          done
          if [ $count -eq $max_retries ]; then
            echo "Failed to initialize LXD after $max_retries attempts"
            exit 1
          fi

      - name: Setup network for LXD
        run: |
          sudo lxc network create lxdbr0 || true
          sudo lxc network attach-profile lxdbr0 default eth0 || true

      - name: Build Snap Package
        run: |
          snapcraft --destructive-mode --verbose

      - name: Upload Snap Artifact
        uses: actions/upload-artifact@v4
        with:
          name: snap-artifact
          path: "*.snap"

  release:
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux, create-deb, create-snap]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-artifacts
          path: ./
      - uses: actions/download-artifact@v4
        with:
          name: linux-artifact
          path: ./
      - uses: actions/download-artifact@v4
        with:
          name: deb-artifact
          path: ./
      - uses: actions/download-artifact@v4
        with:
          name: snap-artifact
          path: ./

      - name: Upload All Release Assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            hamnt.*.win-x64.zip
            win.installer/hamnt-*-setup.exe
            hamnt.*.linux-x64.tar.gz
            bin/Release/net8.0/linux-x64/*.deb
            *.snap

