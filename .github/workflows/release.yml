name: Release Build

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64

    steps:
    - uses: actions/checkout@v3
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'

    - name: Build
      run: |
        dotnet publish -c Release -r ${{ matrix.rid }} \
          --self-contained true \
          -p:PublishSingleFile=true \
          -p:EnableCompressionInSingleFile=true

    - name: Create Release Asset
      run: |
        cd bin/Release/net8.0/${{ matrix.rid }}/publish/
        if [ "${{ matrix.os }}" = "windows-latest" ]; then
          7z a -tzip ../../../../../hamnt-${{ matrix.rid }}.zip hamnt.exe
        else
          tar czf ../../../../../hamnt-${{ matrix.rid }}.tar.gz hamnt
        fi
      shell: bash

    - name: Upload Release Asset
      uses: softprops/action-gh-release@v1
      with:
        files: |
          hamnt-${{ matrix.rid }}.zip
          hamnt-${{ matrix.rid }}.tar.gz